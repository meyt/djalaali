{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_current_language_bidi as LANGUAGE_BIDI %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <title>djalaali demo</title>
  <style>
    body { font-family: sans-serif; max-width: 48rem; margin: 2rem auto; }
    nav a { margin-inline-end: 1rem; }
    td, th { padding: .25rem .75rem; text-align: start; }
    .gregorian { direction: ltr; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="{% url 'index' %}">Events</a>
    <a href="{% url 'convert' %}">Converter</a>
    <a href="{% url 'admin:index' %}">Admin</a>
    {% include "events/_lang_toggle.html" %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
