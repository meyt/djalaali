{% load i18n %}{% get_current_language as LANGUAGE_CODE %}
<form action="{% url 'set_language' %}" method="post" style="display: inline-block; margin: 0;">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" name="language" value="{% if LANGUAGE_CODE == 'fa' %}en{% else %}fa{% endif %}">
  <button type="submit" title="Toggle language (changes page and admin direction)">{% if LANGUAGE_CODE == 'fa' %}English{% else %}فارسی{% endif %}</button>
</form>
