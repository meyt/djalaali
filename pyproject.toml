[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Internationalization",
]
dependencies = ["Django>=4.2"]
description = "Jalali (Persian) calendar support for Django"
dynamic = ["version"]
keywords = ["django", "jalali", "persian", "calendar", "jdate"]
license = {text = "MIT"}
name = "djalaali"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist"]

[tool.setuptools.dynamic]
version = {attr = "djalaali.__version__"}

[tool.setuptools]
packages = ["djalaali", "djalaali.templatetags"]

[tool.setuptools.package-data]
djalaali = ["static/djalaali/**/*"]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal --cov=djalaali --cov-report=term-missing"
testpaths = ["djalaali/tests"]

[tool.ruff.lint]
ignore = ["RUF023", "B017", "I001", "PLR0402", "RUF012"]

[tool.coverage.run]
branch = true
omit = ["djalaali/tests/*"]
